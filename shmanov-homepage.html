<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #0b0e14;
  color: #e4e8f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;

  border-radius: 12px;
  padding: 18px 20px;

  color: #e4e8f0;
  display: flex;
  align-items: center;
  gap: 14px;

.tool-card:hover {
  border-color: #34d399;

.tool-icon {
